<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HueTube Demo</title>
  <link rel="stylesheet" href="styles/styles.min.css">
  <link rel="stylesheet" href="styles/revive.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="demo-toast" class="toast" role="status" aria-live="polite">
    <div class="toast-body">
      <h2>Legacy Demo Mode</h2>
      <p>This hosted version uses mocked data because GitHub Pages cannot reach a local Hue bridge.</p>
      <p class="toast-tip">Try toggles, color swatches, and the ALL LIGHTS controls.</p>
    </div>
    <button id="dismiss-toast" class="toast-close" type="button" aria-label="Dismiss demo notice">x</button>
  </aside>

  <div class="siteContainer">
    <div class="firstHeader">Phillips Hue</div>
    <div id="lightControllerDiv">
      <div class="lightInfoContainer" id="lightInfoContainer"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
